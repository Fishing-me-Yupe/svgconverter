<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smooth SVG Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.js"></script>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --accent-color: #238636;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 20px; }
    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 20px;
      box-sizing: border-box;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label { font-size: 0.85rem; font-weight: bold; }
    input[type="range"], input[type="file"] {
      width: 100%;
    }
    .preview-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .preview-box {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      background-image: linear-gradient(45deg, #21262d 25%, transparent 25%),
                        linear-gradient(135deg, #21262d 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #21262d 75%),
                        linear-gradient(135deg, transparent 75%, #21262d 75%);
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .preview-box img, .preview-box svg {
      max-width: 100%;
      max-height: 300px;
      height: auto;
    }
    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
      transition: background-color 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #2ea043;
    }
    button:disabled {
      background-color: #21262d;
      color: #484f58;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h1>Smooth SVG Converter</h1>

  <div class="container">
    <div class="control-group">
      <label for="imageInput">画像を選択 (PNG, JPG, WebP)</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <hr style="border-color: var(--border-color); margin: 20px 0;">

    <div class="controls">
      <div class="control-group">
        <label for="colorNum">色数の制限 (グラデーション階調): <span id="colorNumVal">16</span></label>
        <input type="range" id="colorNum" min="2" max="64" value="16">
      </div>
      <div class="control-group">
        <label for="blurRadius">境界の平滑化 (ぼかし): <span id="blurVal">1</span>px</label>
        <input type="range" id="blurRadius" min="0" max="10" value="1" step="0.5">
      </div>
      <div class="control-group">
        <label for="curveSmooth">曲線のスムーズさ: <span id="smoothVal">1</span></label>
        <input type="range" id="curveSmooth" min="0" max="5" value="1" step="0.5">
      </div>
    </div>

    <button id="downloadBtn" disabled>SVGをダウンロード</button>

    <div class="preview-container">
      <div>
        <p style="text-align: center; margin-bottom: 5px;">元画像</p>
        <div class="preview-box" id="originalPreview"></div>
      </div>
      <div>
        <p style="text-align: center; margin-bottom: 5px;">変換後のSVG（プレビュー）</p>
        <div class="preview-box" id="svgPreview"></div>
      </div>
    </div>
  </div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const colorNum = document.getElementById('colorNum');
    const blurRadius = document.getElementById('blurRadius');
    const curveSmooth = document.getElementById('curveSmooth');
    const downloadBtn = document.getElementById('downloadBtn');
    
    const colorNumVal = document.getElementById('colorNumVal');
    const blurVal = document.getElementById('blurVal');
    const smoothVal = document.getElementById('smoothVal');

    let currentImg = null;
    let svgResultData = null;

    // スライダー変更時に数値を更新して即時リポート
    colorNum.addEventListener('input', (e) => { colorNumVal.textContent = e.target.value; processImage(); });
    blurRadius.addEventListener('input', (e) => { blurVal.textContent = e.target.value; processImage(); });
    curveSmooth.addEventListener('input', (e) => { smoothVal.textContent = e.target.value; processImage(); });

    // 画像ファイル読み込み
    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          currentImg = img;
          document.getElementById('originalPreview').innerHTML = `<img src="${event.target.result}" alt="Original">`;
          processImage();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // 変換およびプレビュー描画処理
    function processImage() {
      if (!currentImg) return;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = currentImg.width;
      canvas.height = currentImg.height;

      // ぼかし前処理（境目の平滑化）
      const blur = parseFloat(blurRadius.value);
      ctx.filter = blur > 0 ? `blur(${blur}px)` : 'none';
      ctx.drawImage(currentImg, 0, 0);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

      const options = {
        numberofcolors: parseInt(colorNum.value),
        strokewidth: 0,
        linefilter: true,
        scale: 1,
        roundcoords: 2,
        blurradius: 0,
        blurdelta: 20,
        ltres: parseFloat(curveSmooth.value),
        qtres: parseFloat(curveSmooth.value)
      };

      // ImageTracerによるSVG生成
      ImageTracer.imagedataToSVG(imageData, (svgString) => {
        svgResultData = svgString;
        
        // 右側の領域にSVGを描画（プレビュー表示）
        const svgContainer = document.getElementById('svgPreview');
        svgContainer.innerHTML = svgString;

        // ボタンの有効化
        downloadBtn.disabled = false;
      }, options);
    }

    // SVGダウンロード機能
    downloadBtn.addEventListener('click', () => {
      if (!svgResultData) return;

      const blob = new Blob([svgResultData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'converted_vector.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
